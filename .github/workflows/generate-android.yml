name: Generate Android Platform Files

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Generate the android/ folder (does not touch lib/)
        run: |
          cd flutter_app
          flutter create --platforms=android .

      - name: Commit and push the generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flutter_app/android
          git commit -m "Add generated Android platform files" || echo "Nothing to commit"
          git push
